name: Keep Supabase awake

# Supabase 免费项目 7 天没人用会自动暂停。
# 这个任务每星期一和星期四自动读取一次数据库，让它保持运作。
on:
  schedule:
    - cron: '17 1 * * 1,4'   # 每周一、周四 UTC 01:17（马来西亚时间 09:17）
  workflow_dispatch:          # 也可以在 Actions 页面手动执行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dywzhlcsdrrvdwbapiqk.supabase.co/rest/v1/taichi_poses?select=id&limit=1" \
            -H "apikey: sb_publishable_E5MwhNCreyn5eq9Vf4uvNw_7O6zH2zW")
          echo "Supabase 回应：HTTP $code"
          test "$code" = "200"
